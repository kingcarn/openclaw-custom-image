name: Build custom OpenClaw image
run-name: OpenClaw ${{ inputs.openclaw_version }} revision ${{ inputs.revision }}
on:
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: 'Exact official version, without v (example: 2026.10.8)'
        required: true
        type: string
      revision:
        description: 'Custom image revision (positive integer)'
        required: true
        default: '1'
        type: string
permissions:
  contents: read
concurrency:
  group: image-${{ inputs.openclaw_version }}-${{ inputs.revision }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate inputs and target repository
        id: meta
        shell: bash
        env:
          VERSION: ${{ inputs.openclaw_version }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == kingcarn/openclaw-custom-image ]]
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(-beta\.[0-9]+)?$ ]]
          [[ "$REVISION" =~ ^[1-9][0-9]*$ ]]
          echo "image=ghcr.io/kingcarn/openclaw-custom:${VERSION}-r${REVISION}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing tag
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE" > /tmp/manifest.out 2> /tmp/manifest.err; then
            echo 'Tag already exists. Increase revision.' >&2
            exit 1
          fi
          if ! grep -Eiq 'manifest unknown|no such manifest|not found' /tmp/manifest.err; then
            cat /tmp/manifest.err >&2
            exit 1
          fi
      - name: Check shell script
        run: bash -n scripts/check-image.sh && shellcheck scripts/check-image.sh
      - name: Build locally on runner
        env:
          VERSION: ${{ inputs.openclaw_version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker build --pull --platform linux/amd64 \
            --build-arg "OPENCLAW_VERSION=$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE" .
      - name: Smoke-test image before publishing
        env:
          VERSION: ${{ inputs.openclaw_version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker run --rm --network none --entrypoint /bin/bash \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/check-image.sh,dst=/tmp/check-image.sh,readonly" \
            "$IMAGE" /tmp/check-image.sh "$VERSION"
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker push "$IMAGE"
          printf '### Published image\n\n`%s`\n\nSmoke test passed. Deployment is manual.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
